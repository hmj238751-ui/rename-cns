<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>论文文献智能改名设置</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <div class="brand">
      <div class="brand-mark">↗</div>
      <div>
        <h1>论文文献智能改名设置</h1>
        <div class="muted">让下载的论文更容易检索、归档和复用</div>
      </div>
    </div>

    <h2>文件名规则</h2>
    <label class="field-label" for="filenameTemplate">文件名模板</label>
    <input
      class="text-input"
      id="filenameTemplate"
      type="text"
      autocomplete="off"
      spellcheck="false"
      aria-describedby="templateHelp"
    >
    <div class="field-help" id="templateHelp">
      内置字段：<code>{year}</code> <code>{journal}</code> <code>{title}</code> <code>{doi}</code>，可自由调整顺序和分隔符。
    </div>

    <div class="section-heading">
      <h2>自定义字段</h2>
      <button id="addCustomField" type="button">+  添加字段</button>
    </div>
    <div class="custom-fields" id="customFields"></div>
    <template id="customFieldTemplate">
      <div class="custom-field-row">
        <label>
          <span>字段名</span>
          <input class="text-input custom-field-name" type="text" autocomplete="off" placeholder="例如：项目" aria-label="自定义字段名">
        </label>
        <label>
          <span>固定值</span>
          <input class="text-input custom-field-value" type="text" autocomplete="off" placeholder="例如：肿瘤研究" aria-label="自定义字段固定值">
        </label>
        <button class="remove-field" type="button" aria-label="删除自定义字段">删除</button>
      </div>
    </template>
    <div class="field-help">字段名可使用中文、英文、数字和下划线。添加后，在模板中使用 <code>{字段名}</code>。</div>

    <div class="preview-card" aria-live="polite">
      <div class="preview-label">文件名预览</div>
      <div class="preview-value" id="filenamePreview"></div>
    </div>
    <div class="error-message" id="settingsError" role="alert" hidden></div>

    <h2>元数据来源</h2>
    <label class="setting">
      <input id="useCrossref" type="checkbox">
      <span>使用 Crossref 补全文献元数据<small>当页面提供 DOI，或已识别出标题但缺少年份/期刊时，尝试查询 Crossref。</small></span>
    </label>
    <label class="setting">
      <input id="usePubMed" type="checkbox">
      <span>使用 NCBI/PubMed 补全医学论文元数据<small>支持 Cell 的 PII 下载地址和 PMC 论文直接 PDF 地址。</small></span>
    </label>
    <label class="setting">
      <input id="allowFilenameFallback" type="checkbox">
      <span>无法识别标题时，使用原文件名作为标题<small>建议关闭。很多出版社文件名是内部编号，直接使用会得到不够准确的名称。</small></span>
    </label>

    <div class="note">扩展只提取当前文章页的公开元标签（如 citation_title、citation_doi），不会上传网页正文。浏览器扩展只能在下载落盘前建议文件名，因此对已经下载完成的旧文件不会自动改名。</div>
    <div class="button-row">
      <button class="primary" id="save">保存设置</button>
      <span class="muted" id="saved"></span>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
